on:
  workflow_call:
    inputs:
      jfrog_url:
        description: "URL of Artifactory server"
        type: string
        default: "nethermind.jfrog.io"
        required: false
      image_name:
        description: "Name of the image to publish.  Defaults to the repository name."
        type: string
        required: false
        default: "${{ github.event.repository.name }}"
      group_name:
        description: "Name of the group in Nethermind.  Example: nubia, kyoto, etc"
        type: string
        required: false
        default: ""
      target_env:
        description: "Target environment to promote to (either staging or prod)"
        type: string
        required: true
      source_env:
        description: "Source environment to promote from (either dev or staging)"
        type: string
        required: false
        default: "none"
      source_tag:
        description: "Source tag to promote from."
        type: string
        required: false
        default: "none"
      tags:
        description: "Tags to promote (comma-separated)"
        type: string
        required: true
      skip_attest:
        description: "Skip attest"
        type: string
        required: false
        default: false

permissions:
  id-token: write
  attestations: write
  artifact-metadata: write
  contents: read

jobs:
  promote:
    name: Promote Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Validate input
        env:
          INPUT_TARGET_ENV: ${{ inputs.target_env }}
          INPUT_SOURCE_ENV: ${{ inputs.source_env }}
        run: |
          if [[ ! "${INPUT_TARGET_ENV}" =~ ^(staging|prod)$ ]]; then
            echo "Invalid environment. Choose 'staging' or 'prod'"
            exit 1
          fi

          if [[ ! "${INPUT_SOURCE_ENV}" =~ ^(dev|staging|none)$ ]]; then
            echo "Invalid environment. Choose 'dev', 'staging' or don't set it"
            exit 1
          fi

      - name: Set environment variables
        env:
          INPUT_SOURCE_ENV: ${{ inputs.source_env }}
          INPUT_TARGET_ENV: ${{ inputs.target_env }}
          INPUT_JFROG_URL: ${{ inputs.jfrog_url }}
          INPUT_GROUP_NAME: ${{ inputs.group_name }}
          INPUT_IMAGE_NAME: ${{ inputs.image_name }}
        run: |
          if [[ "${INPUT_SOURCE_ENV}" == "none" ]]; then
            SOURCE_ENV=$([[ "${INPUT_TARGET_ENV}" == "staging" ]] && echo "dev" || echo "staging")
          else
            SOURCE_ENV="${INPUT_SOURCE_ENV}"
          fi

          SOURCE_IMAGE="${INPUT_JFROG_URL}/${INPUT_GROUP_NAME}-oci-local-${SOURCE_ENV}/${INPUT_IMAGE_NAME}"
          TARGET_IMAGE="${INPUT_JFROG_URL}/${INPUT_GROUP_NAME}-oci-local-${INPUT_TARGET_ENV}/${INPUT_IMAGE_NAME}"

          EOF_MARKER="GHEOF_$(openssl rand -hex 8)"
          {
            echo "SOURCE_ENV<<${EOF_MARKER}"
            echo "${SOURCE_ENV}"
            echo "${EOF_MARKER}"
            echo "SOURCE_IMAGE<<${EOF_MARKER}"
            echo "${SOURCE_IMAGE}"
            echo "${EOF_MARKER}"
            echo "TARGET_IMAGE<<${EOF_MARKER}"
            echo "${TARGET_IMAGE}"
            echo "${EOF_MARKER}"
          } >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install JFrog CLI
        id: jfrog
        uses: jfrog/setup-jfrog-cli@deda456d982fc5e9a7a020b63eb0d2968aedd33e # v5.1.0
        env:
          JF_URL: https://${{ inputs.jfrog_url }}
        with:
          oidc-provider-name: github-nethermindeth

      - name: Login to Registry with OIDC
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ inputs.jfrog_url }}
          username: ${{ steps.jfrog.outputs.oidc-user }}
          password: ${{ steps.jfrog.outputs.oidc-token }}

      - name: Setup oras cli
        uses: oras-project/setup-oras@38de303aac69abb66f3e6255b7198bff35f323e3 # v2.0.0

      - name: Promote Images
        id: promote
        env:
          INPUT_TAGS: ${{ inputs.tags }}
          INPUT_SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          # Promote all specified tags
          IFS=',' read -ra TAGS <<< "${INPUT_TAGS}"
          for i in "${!TAGS[@]}"; do
            TAGS[$i]=$(echo "${TAGS[$i]}" | xargs)
          done
          for TAG in "${TAGS[@]}"; do
            if [[ "${INPUT_SOURCE_TAG}" != "none" ]]; then
              source_image="${SOURCE_IMAGE}:${INPUT_SOURCE_TAG}"
            else
              source_image="${SOURCE_IMAGE}:${TAG}"
            fi
            target_image="${TARGET_IMAGE}:${TAG}"
            echo "Promoting ${source_image} to ${target_image}"

            oras cp -r ${source_image} ${target_image}

            # Get image digest and add it to the subject.checksums.txt file
            DIGEST=$(docker buildx imagetools inspect "${target_image}" --raw | sha256sum | cut -d' ' -f1)
            echo "${DIGEST}  ${TARGET_IMAGE}" >> subject.checksums.txt
          done

      - name: Attest
        if: ${{ inputs.skip_attest != 'true' }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        id: attest
        with:
          subject-name: ${{ env.TARGET_IMAGE }}
          subject-checksums: subject.checksums.txt
          push-to-registry: true

      - name: Record Promotion
        env:
          INPUT_TAGS: ${{ inputs.tags }}
        run: |
          echo "## Image Promotion :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "- From: $SOURCE_IMAGE" >> $GITHUB_STEP_SUMMARY
          echo "- To: $TARGET_IMAGE" >> $GITHUB_STEP_SUMMARY
          echo "- Tags: ${INPUT_TAGS}" >> $GITHUB_STEP_SUMMARY
          echo "- Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
