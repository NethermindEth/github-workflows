name: Docker Promote (Same Repo via OIDC)

on:
  workflow_call:
    inputs:
      jfrog_url:
        description: "JFrog base URL (e.g. nethermind.jfrog.io)"
        required: true
        type: string
      repo_name:
        description: "JFrog repo name (e.g. pmo-oci-local-staging)"
        required: true
        type: string
      image_name:
        description: "Image name (e.g. yokai-dash-api-backend)"
        required: true
        type: string
      source_tag:
        description: "Source tag to copy from"
        required: true
        type: string
      tags:
        description: "Comma-separated list of tags to promote to"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  promote:
    name: Promote (Same Repo)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 🔐 Use OIDC to get a JFrog token dynamically
      - name: Install JFrog CLI (for OIDC token)
        id: jfrog
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: https://${{ inputs.jfrog_url }}
        with:
          oidc-provider-name: github-nethermindeth

      - name: Login to JFrog OCI Registry via OIDC
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.jfrog_url }}
          username: ${{ steps.jfrog.outputs.oidc-user }}
          password: ${{ steps.jfrog.outputs.oidc-token }}

      - name: Setup ORAS CLI
        uses: oras-project/setup-oras@v1

      - name: Promote Tags (in same repo)
        run: |
          SRC="${{ inputs.jfrog_url }}/${{ inputs.repo_name }}/${{ inputs.image_name }}:${{ inputs.source_tag }}"
          IFS=',' read -ra TAGS <<< "${{ inputs.tags }}"

          echo "🚀 Promoting from: $SRC"
          for TAG in "${TAGS[@]}"; do
            DST="${{ inputs.jfrog_url }}/${{ inputs.repo_name }}/${{ inputs.image_name }}:${TAG}"
            echo "➡️  Copying $SRC → $DST"
            oras cp -r "$SRC" "$DST"
          done

      - name: Record Promotion Summary
        run: |
          echo "## 🧩 Image Promotion Summary" >> $GITHUB_STEP_SUMMARY
          echo "- JFrog Repo: ${{ inputs.repo_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Image: ${{ inputs.image_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Source Tag: ${{ inputs.source_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- Promoted Tags: ${{ inputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "- Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
