on:
  workflow_call:
    inputs:
      source_repo_name:
        description: "Name of the repository to get the image from"
        type: string
        required: false
        default: "nethermindeth"
      target_repo_name:
        description: "Name of the repository to push the image to"
        type: string
        required: false
        default: "nethermind"
      image_name:
        description: "Name of the image to publish.  Defaults to the repository name."
        type: string
        required: false
        default: "${{ github.event.repository.name }}"
      source_tag:
        description: "Source tag to promote from."
        type: string
        required: false
        default: "none"
      tags:
        description: "Tags to promote (comma-separated)"
        type: string
        required: true
    secrets:
      dockerhub_username:
        description: "Docker Hub username"
        required: true
      dockerhub_password:
        description: "Docker Hub password"
        required: true

permissions:
  id-token: write
  attestations: write
  artifact-metadata: write
  contents: read

jobs:
  promote:
    name: Promote Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Set environment variables
        env:
          INPUT_SOURCE_REPO_NAME: ${{ inputs.source_repo_name }}
          INPUT_TARGET_REPO_NAME: ${{ inputs.target_repo_name }}
          INPUT_IMAGE_NAME: ${{ inputs.image_name }}
        run: |
          SOURCE_IMAGE="${INPUT_SOURCE_REPO_NAME}/${INPUT_IMAGE_NAME}"
          TARGET_IMAGE="${INPUT_TARGET_REPO_NAME}/${INPUT_IMAGE_NAME}"
          EOF_MARKER="GHEOF_$(openssl rand -hex 8)"
          {
            echo "SOURCE_IMAGE<<${EOF_MARKER}"
            echo "${SOURCE_IMAGE}"
            echo "${EOF_MARKER}"
            echo "TARGET_IMAGE<<${EOF_MARKER}"
            echo "${TARGET_IMAGE}"
            echo "${EOF_MARKER}"
          } >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.dockerhub_username }}
          password: ${{ secrets.dockerhub_password }}

      - name: Setup oras cli
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Promote Images
        id: promote
        env:
          INPUT_TAGS: ${{ inputs.tags }}
          INPUT_SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          # Promote all specified tags
          IFS=',' read -ra TAGS <<< "${INPUT_TAGS}"
          for i in "${!TAGS[@]}"; do
            TAGS[$i]=$(echo "${TAGS[$i]}" | xargs)
          done
          for TAG in "${TAGS[@]}"; do
            if [[ "${INPUT_SOURCE_TAG}" != "none" ]]; then
              source_image="${SOURCE_IMAGE}:${INPUT_SOURCE_TAG}"
            else
              source_image="${SOURCE_IMAGE}:${TAG}"
            fi
            target_image="${TARGET_IMAGE}:${TAG}"
            echo "Promoting ${source_image} to ${target_image}"

            oras cp -r ${source_image} ${target_image}

            # Get image digest and add it to the subject.checksums.txt file
            DIGEST=$(docker buildx imagetools inspect "${target_image}" --raw | sha256sum | cut -d' ' -f1)
            echo "${DIGEST}  ${TARGET_IMAGE}" >> subject.checksums.txt
          done

      - name: Attest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        id: attest
        with:
          subject-name: ${{ env.TARGET_IMAGE }}
          subject-checksums: subject.checksums.txt
          push-to-registry: true

      - name: Record Promotion
        env:
          INPUT_TAGS: ${{ inputs.tags }}
        run: |
          echo "## Image Promotion :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "- From: $SOURCE_IMAGE" >> $GITHUB_STEP_SUMMARY
          echo "- To: $TARGET_IMAGE" >> $GITHUB_STEP_SUMMARY
          echo "- Tags: ${INPUT_TAGS}" >> $GITHUB_STEP_SUMMARY
          echo "- Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
