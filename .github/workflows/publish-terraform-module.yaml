name: Publish Terraform Module

on:
  workflow_call:
    inputs:
      jfrog_url:
        description: "URL of Artifactory server"
        type: string
        default: "https://nethermind.jfrog.io"
      provider_name:
        description: "Name of Terraform provider"
        type: string
        required: true
      module_name:
        description: "Name of Terraform module"
        type: string
        required: true
      module_version:
        description: "Version of Terraform module"
        type: string
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v4.2.2

      - name: Set up JFrog CLI
        id: jfrog
        uses: jfrog/setup-jfrog-cli@5b06f730cc5a6f55d78b30753f8583454b08c0aa # v4.8.1
        env:
          JF_URL: ${{ inputs.jfrog_url }}
        with:
          oidc-provider-name: github-nethermindeth

      - name: Configure Terraform registry
        shell: bash
        run: jf tfc --repo-deploy=local-angkor-terraform-module

      - name: Run Trivy vulnerability scanner in IaC mode
        id: trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: "config"
          scan-ref: "."
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"
          output: "trivy-results.txt"
          version: "v0.69.3"
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db
          TRIVY_DISABLE_VEX_NOTICE: true

      - name: Publish Terraform module
        if: ${{ success() }}
        shell: bash
        env:
          INPUT_MODULE_NAME: ${{ inputs.module_name }}
          INPUT_PROVIDER_NAME: ${{ inputs.provider_name }}
          INPUT_MODULE_VERSION: ${{ inputs.module_version }}
        run: |
          mkdir -p package
          rsync -Rr --exclude=".*" --exclude="example" --exclude="package" ./ "package/${INPUT_MODULE_NAME}"
          cd "package/${INPUT_MODULE_NAME}"
          jf terraform publish \
            --namespace=nethermind \
            --provider="${INPUT_PROVIDER_NAME}" \
            --tag "${INPUT_MODULE_VERSION}"

      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "### Publish status" >> $GITHUB_STEP_SUMMARY
          if [ "${JOB_STATUS}" == "success" ]; then
            echo "✅ Publish successful" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Publish failed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "### Trivy Scan Output" >> $GITHUB_STEP_SUMMARY
          if [[ -f trivy-results.txt ]]; then
            echo "<details><summary>Click to expand</summary>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            while IFS= read -r line; do
              if [[ $line == "┌"* ]]; then echo '```' >> $GITHUB_STEP_SUMMARY; fi
              echo "$line" >> $GITHUB_STEP_SUMMARY
              if [[ $line == *"┘" ]]; then echo '```' >> $GITHUB_STEP_SUMMARY; fi
            done < trivy-results.txt
            echo "</details>" >> $GITHUB_STEP_SUMMARY
          else
            echo "No Trivy report found." >> $GITHUB_STEP_SUMMARY
          fi
