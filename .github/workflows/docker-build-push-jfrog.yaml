on:
  workflow_call:
    inputs:
      runner:
        description: "Runner to use"
        type: string
        required: false
        default: "ubuntu-latest"
      git_repository:
        description: "Name of the git repository to checkout and build from"
        type: string
        required: false
        default: ${{ github.repository }}
      git_ref:
        description: "Git reference to checkout"
        type: string
        required: false
        default: ''
      checkout_submodules:
        description: "Check out submodules type.  Defaults to recursive"
        type: string
        required: false
        default: "recursive"
      repo_name:
        description: "Name of the repository to publish to"
        type: string
        required: false
        default: ""
      jfrog_url:
        description: "URL of Artifactory server"
        type: string
        default: "nethermind.jfrog.io"
        required: false
      image_name:
        description: "Name of the image to publish.  Defaults to the repository name."
        type: string
        required: false
        default: "${{ github.event.repository.name }}"
      group_name:
        description: "Name of the group in Nethermind.  Example: nubia, kyoto, etc"
        type: string
        required: false
        default: ""
      push:
        description: "Whether or not to push to Artifactory"
        type: boolean
        default: true
        required: false
      context:
        description: "Build's context is the set of files located in the specified PATH or URL"
        type: string
        default: "."
        required: false
      pre_build_script:
        description: "Script to run before the build"
        type: string
        required: false
        default: ""
      platforms:
        description: "Platforms to build for (comma-separated)"
        type: string
        default: "linux/amd64,linux/arm64"
        required: false
      fetch-depth:
        description: "Fetch depth"
        type: number
        required: false
        default: 1
      setup-qemu:
        description: "Set up QEMU"
        type: boolean
        default: false
        required: false
      dockerfile_path:
        description: "Path to Dockerfile"
        type: string
        default: "Dockerfile"
        required: false
      additional_tags:
        description: "Additional tags to apply (comma-separated)"
        type: string
        default: ""
        required: false
      docker_secrets:
        description: "List of secrets to expose to the build (e.g., key=string, GIT_AUTH_TOKEN=mytoken)"
        type: string
        required: false
      docker_secret_envs:
        description: "List of secret env vars to expose to the build (e.g., key=envname, MY_SECRET=MY_ENV_VAR)"
        required: false
        type: string
      docker_secret_files:
        description: "List of secret files to expose to the build (e.g., key=filename, MY_SECRET=./secret.txt)"
        required: false
        type: string
      docker_ulimit:
        description: "Ulimit options (e.g., nofile=1024:1024)"
        required: false
        type: string
      docker_build_args:
        description: "List of build-time variables"
        required: false
        type: string
      cache_from:
        description: "BuildKit cache sources passed to the build (e.g. type=gha). Set to an empty string to disable the layer cache, for builds whose stages pull private images or consume secrets."
        required: false
        type: string
        default: "type=gha"
      cache_to:
        description: "BuildKit cache export passed to the build (e.g. type=gha,mode=max). Set to an empty string to disable."
        required: false
        type: string
        default: "type=gha,mode=max"
      infisical_env_slug:
        description: "Infisical environment slug (dev, staging, prod) to load build secrets from. Requires infisical_secret_path and the infisical_* secrets."
        required: false
        type: string
        default: ""
      infisical_secret_path:
        description: "Infisical secret path whose secrets are exported into the job environment before the build (masked), so docker_secret_envs can name them (e.g. my_key=MY_SECRET). Empty disables the step."
        required: false
        type: string
        default: ""
    secrets:
      git_token:
        description: "Git token to use for checkout"
        required: false
      infisical_identity_id:
        description: "Infisical machine identity ID (OIDC auth). Only used when infisical_secret_path is set."
        required: false
      infisical_project_id:
        description: "Infisical project ID. Only used when infisical_secret_path is set."
        required: false

permissions:
  id-token: write
  attestations: write
  artifact-metadata: write
  contents: read

jobs:
  publish:
    name: Build and publish Docker image
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.git_repository }}
          token: ${{ secrets.git_token || github.token }}
          ref: ${{ inputs.git_ref }}
          submodules: ${{ inputs.checkout_submodules }}
          fetch-depth: ${{ inputs.fetch-depth }}
          persist-credentials: false

      - name: Set env vars
        id: env-vars
        env:
          INPUT_REPO_NAME: ${{ inputs.repo_name }}
          INPUT_GROUP_NAME: ${{ inputs.group_name }}
          INPUT_IMAGE_NAME: ${{ inputs.image_name }}
        run: |
          # Set Repo name
          if [[ -n "${INPUT_REPO_NAME}" ]]; then
            export REPO_NAME="${INPUT_REPO_NAME}"
          elif [[ -n "${INPUT_GROUP_NAME}" ]]; then
            export REPO_NAME="${INPUT_GROUP_NAME}-oci-local-dev"
          else
            echo "Unable to determine the repo name.  Please set either group_name or the repo_name."
            exit 1
          fi

          # Set image name
          echo "IMAGE_NAME=${REPO_NAME}/${INPUT_IMAGE_NAME}" >> $GITHUB_OUTPUT

      - name: Install JFrog CLI
        if: ${{ inputs.push }}
        id: jfrog
        uses: jfrog/setup-jfrog-cli@1a84ddcff2d475751d8392ef6d7ecb478a7cfe53 # v5.3.1
        env:
          JF_URL: https://${{ inputs.jfrog_url }}
        with:
          oidc-provider-name: github-nethermindeth

      - name: Login to Registry with OIDC
        if: ${{ inputs.push }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ inputs.jfrog_url }}
          username: ${{ steps.jfrog.outputs.oidc-user }}
          password: ${{ steps.jfrog.outputs.oidc-token }}

      # Build-time secrets from Infisical. Exported into the job environment (every value
      # masked) so the caller's docker_secret_envs can hand them to BuildKit as secret mounts.
      # Same OIDC-to-Infisical action ai-review.yaml uses; nothing long-lived is stored.
      - name: Load build secrets from Infisical
        if: ${{ inputs.infisical_secret_path != '' }}
        uses: NethermindEth/github-workflows/get_infisical_secrets@3aa8d07182110ddd5c7f3bad9d746a1db58f6f8c
        with:
          identity-id: ${{ secrets.infisical_identity_id }}
          project-id: ${{ secrets.infisical_project_id }}
          env-slug: ${{ inputs.infisical_env_slug }}
          secret-path: ${{ inputs.infisical_secret_path }}

      - name: Run pre-build script
        if: ${{ inputs.pre_build_script != '' }}
        env:
          PRE_BUILD_SCRIPT: ${{ inputs.pre_build_script }}
        run: |
          # Accepted risk: pre_build_script is intentionally executed as caller-provided code
          SCRIPT_PATH="${RUNNER_TEMP:-/tmp}/pre_build_$$.sh"
          trap 'rm -f "$SCRIPT_PATH"' EXIT
          printf '%s\n' "$PRE_BUILD_SCRIPT" > "$SCRIPT_PATH"
          chmod +x "$SCRIPT_PATH"
          bash "$SCRIPT_PATH"

      - name: Select Xray scan platform
        if: ${{ inputs.push }}
        id: scan-platform
        env:
          INPUT_PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          platform="${INPUT_PLATFORMS%%,*}"
          platform="${platform//[[:space:]]/}"
          if [[ ! "${platform}" =~ ^[a-z0-9]+/[a-z0-9]+(/[a-z0-9]+)?$ ]]; then
            echo "::error::Invalid platform '${platform}' in platforms input"
            exit 1
          fi
          echo "platform=${platform}" >> "$GITHUB_OUTPUT"

      - name: Name Xray scan image
        if: ${{ inputs.push }}
        id: scan-image
        run: |
          set -euo pipefail
          repo="$(printf '%s' "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')"
          if [[ ! "${repo}" =~ ^[a-z0-9]+((\.|_|__|-+)[a-z0-9]+)*$ ]]; then
            echo "::error::Repository name '${repo}' is not a valid Docker image name component"
            exit 1
          fi
          echo "image=xray-scan-${repo}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU for Xray scan build
        if: ${{ inputs.push && inputs.setup-qemu }}
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx for Xray scan build
        if: ${{ inputs.push }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image for Xray scan
        if: ${{ inputs.push }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }} # zizmor: ignore[template-injection]
          file: ${{ inputs.dockerfile_path }}
          platforms: ${{ steps.scan-platform.outputs.platform }}
          tags: ${{ steps.scan-image.outputs.image }}
          load: true
          push: false
          cache-from: ${{ inputs.cache_from }}
          cache-to: ${{ inputs.cache_to }}
          secrets: ${{ inputs.docker_secrets }}
          secret-envs: ${{ inputs.docker_secret_envs }}
          secret-files: ${{ inputs.docker_secret_files }}
          ulimit: ${{ inputs.docker_ulimit }}
          build-args: ${{ inputs.docker_build_args }}

      - name: Xray scan gate
        if: ${{ inputs.push }}
        env:
          SCAN_IMAGE: ${{ steps.scan-image.outputs.image }}
          XRAY_WATCH: iac-all-repos
          JFROG_PLATFORM_URL: https://${{ inputs.jfrog_url }}
          XRAY_OIDC_PROVIDER: github-nethermindeth-xray
          XRAY_OIDC_AUDIENCE: jfrog-xray-scan
        run: |
          set -euo pipefail
          umask 077
          JFROG_CLI_HOME_DIR="$(mktemp -d "${RUNNER_TEMP}/jf-xray.XXXXXX")"
          export JFROG_CLI_HOME_DIR
          trap 'rm -rf "${JFROG_CLI_HOME_DIR}"' EXIT

          fail_exchange() {
            echo "::error::Could not get the Xray scan token from ${XRAY_OIDC_PROVIDER}: $1. Image not pushed."
            exit 1
          }
          id_token="$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${XRAY_OIDC_AUDIENCE}" | jq -r '.value // empty')" \
            || fail_exchange "GitHub OIDC token request failed"
          [[ -n "${id_token}" ]] || fail_exchange "GitHub returned no OIDC token"
          echo "::add-mask::${id_token}"
          scan_token="$(jq -n --arg t "${id_token}" --arg p "${XRAY_OIDC_PROVIDER}" \
            '{grant_type: "urn:ietf:params:oauth:grant-type:token-exchange", subject_token_type: "urn:ietf:params:oauth:token-type:id_token", subject_token: $t, provider_name: $p}' \
            | curl -sSf -X POST -H 'Content-Type: application/json' --data @- "${JFROG_PLATFORM_URL}/access/api/v1/oidc/token" \
            | jq -r '.access_token // empty')" \
            || fail_exchange "JFrog token exchange failed"
          [[ -n "${scan_token}" ]] || fail_exchange "JFrog returned no access token"
          echo "::add-mask::${scan_token}"
          jf c add xray-scan --url "${JFROG_PLATFORM_URL}" --access-token "${scan_token}" --interactive=false

          rc=0
          jf docker scan "${SCAN_IMAGE}" --server-id xray-scan --watches "${XRAY_WATCH}" --fail=true || rc=$?
          case "${rc}" in
            0) ;;
            3)
              echo "::error::Xray watch ${XRAY_WATCH} matched a fail-build rule (Critical vulnerability or malicious package). Image not pushed."
              exit 3
              ;;
            *)
              echo "::error::Xray scan did not complete (exit ${rc}): auth, Xray availability, or missing watch ${XRAY_WATCH}. Image not pushed."
              exit "${rc}"
              ;;
          esac

      - name: Build and push
        uses: NethermindEth/github-action-image-build-and-push@361ce6e98f238b169b2000a7224ec1d467cc6506
        with:
          registry: "artifactory"
          image_name: ${{ steps.env-vars.outputs.IMAGE_NAME }}
          image_tags: ${{ inputs.additional_tags }}
          push-to-registry: ${{ inputs.push }}
          platforms: ${{ inputs.platforms }}
          context: ${{ inputs.context }}
          dockerfile_path: ${{ inputs.dockerfile_path }}
          setup-qemu: ${{ inputs.setup-qemu }}
          secrets: ${{ inputs.docker_secrets }}
          secret-envs: ${{ inputs.docker_secret_envs }}
          secret-files: ${{ inputs.docker_secret_files }}
          ulimit: ${{ inputs.docker_ulimit }}
          build-args: ${{ inputs.docker_build_args }}
          cache_from: ${{ inputs.cache_from }}
          cache_to: ${{ inputs.cache_to }}
