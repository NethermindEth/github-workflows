on:
  workflow_call:
    inputs:
      runner:
        description: "Runner to use"
        type: string
        required: false
        default: "ubuntu-latest"
      git_repository:
        description: "Name of the git repository to checkout and build from"
        type: string
        required: false
        default: ${{ github.repository }}
      git_ref:
        description: "Git reference to checkout"
        type: string
        required: false
        default: ''
      checkout_submodules:
        description: "Check out submodules type.  Defaults to recursive"
        type: string
        required: false
        default: "recursive"
      repo_name:
        description: "Name of the repository to publish to"
        type: string
        required: false
        default: ""
      jfrog_url:
        description: "URL of Artifactory server"
        type: string
        default: "nethermind.jfrog.io"
        required: false
      image_name:
        description: "Name of the image to publish.  Defaults to the repository name."
        type: string
        required: false
        default: "${{ github.event.repository.name }}"
      group_name:
        description: "Name of the group in Nethermind.  Example: nubia, kyoto, etc"
        type: string
        required: false
        default: ""
      push:
        description: "Whether or not to push to Artifactory"
        type: boolean
        default: true
        required: false
      context:
        description: "Build's context is the set of files located in the specified PATH or URL"
        type: string
        default: "."
        required: false
      pre_build_script:
        description: "Script to run before the build"
        type: string
        required: false
        default: ""
      platforms:
        description: "Platforms to build for (comma-separated)"
        type: string
        default: "linux/amd64,linux/arm64"
        required: false
      fetch-depth:
        description: "Fetch depth"
        type: number
        required: false
        default: 1
      setup-qemu:
        description: "Set up QEMU"
        type: boolean
        default: false
        required: false
      dockerfile_path:
        description: "Path to Dockerfile"
        type: string
        default: "Dockerfile"
        required: false
      additional_tags:
        description: "Additional tags to apply (comma-separated)"
        type: string
        default: ""
        required: false
      docker_secrets:
        description: "List of secrets to expose to the build (e.g., key=string, GIT_AUTH_TOKEN=mytoken)"
        type: string
        required: false
      docker_secret_envs:
        description: "List of secret env vars to expose to the build (e.g., key=envname, MY_SECRET=MY_ENV_VAR)"
        required: false
        type: string
      docker_secret_files:
        description: "List of secret files to expose to the build (e.g., key=filename, MY_SECRET=./secret.txt)"
        required: false
        type: string
      docker_ulimit:
        description: "Ulimit options (e.g., nofile=1024:1024)"
        required: false
        type: string
      docker_build_args:
        description: "List of build-time variables"
        required: false
        type: string
      ignore_trivy:
        description: "Ignore Trivy scan errors"
        required: false
        type: boolean
        default: false
      run_trivy:
        description: "Run Trivy scan"
        required: false
        type: boolean
        default: true
      sign_image:
        description: "Sign the pushed image with JFrog Evidence"
        required: false
        type: boolean
        default: true
      signing_key_alias:
        description: "JFrog key alias for the Evidence signing key"
        required: false
        type: string
        default: "jfrog-evidence-image-signing"
      predicate_type:
        description: "Predicate type URI for the signature Evidence"
        required: false
        type: string
        default: "https://jfrog.com/evidence/signature/v1"
    secrets:
      git_token:
        description: "Git token to use for checkout"
        required: false
      infisical_identity_id:
        description: "Infisical machine identity ID for the image-signing key (required when sign_image is true)"
        required: false
      infisical_project_id:
        description: "Infisical project ID holding the image-signing private key (required when sign_image is true)"
        required: false

permissions:
  id-token: write
  attestations: write
  artifact-metadata: write
  contents: read

jobs:
  publish:
    name: Build and publish Docker image
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ inputs.git_repository }}
          token: ${{ secrets.git_token || github.token }}
          ref: ${{ inputs.git_ref }}
          submodules: ${{ inputs.checkout_submodules }}
          fetch-depth: ${{ inputs.fetch-depth }}
          persist-credentials: false

      - name: Set env vars
        id: env-vars
        env:
          INPUT_REPO_NAME: ${{ inputs.repo_name }}
          INPUT_GROUP_NAME: ${{ inputs.group_name }}
          INPUT_IMAGE_NAME: ${{ inputs.image_name }}
        run: |
          # Set Repo name
          if [[ -n "${INPUT_REPO_NAME}" ]]; then
            export REPO_NAME="${INPUT_REPO_NAME}"
          elif [[ -n "${INPUT_GROUP_NAME}" ]]; then
            export REPO_NAME="${INPUT_GROUP_NAME}-oci-local-dev"
          else
            echo "Unable to determine the repo name.  Please set either group_name or the repo_name."
            exit 1
          fi

          # Set image name
          echo "IMAGE_NAME=${REPO_NAME}/${INPUT_IMAGE_NAME}" >> $GITHUB_OUTPUT

      - name: Install JFrog CLI
        id: jfrog
        uses: jfrog/setup-jfrog-cli@1641575d87647fb969c0545f0b6a76873e328b7c # v5.0.0
        env:
          JF_URL: https://${{ inputs.jfrog_url }}
        with:
          oidc-provider-name: github-nethermindeth

      - name: Login to Registry with OIDC
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ inputs.jfrog_url }}
          username: ${{ steps.jfrog.outputs.oidc-user }}
          password: ${{ steps.jfrog.outputs.oidc-token }}

      - name: Run pre-build script
        if: ${{ inputs.pre_build_script != '' }}
        env:
          PRE_BUILD_SCRIPT: ${{ inputs.pre_build_script }}
        run: |
          # Accepted risk: pre_build_script is intentionally executed as caller-provided code
          SCRIPT_PATH="${RUNNER_TEMP:-/tmp}/pre_build_$$.sh"
          trap 'rm -f "$SCRIPT_PATH"' EXIT
          printf '%s\n' "$PRE_BUILD_SCRIPT" > "$SCRIPT_PATH"
          chmod +x "$SCRIPT_PATH"
          bash "$SCRIPT_PATH"

      - name: Build and push
        uses: NethermindEth/github-action-image-build-and-push@972f8cf69d5ede0a0cb9d7cc953fa902538e2ffa
        with:
          registry: "artifactory"
          image_name: ${{ steps.env-vars.outputs.IMAGE_NAME }}
          image_tags: |
            ${{ github.sha }}
            ${{ inputs.additional_tags }}
          push-to-registry: ${{ inputs.push }}
          platforms: ${{ inputs.platforms }}
          context: ${{ inputs.context }}
          dockerfile_path: ${{ inputs.dockerfile_path }}
          setup-qemu: ${{ inputs.setup-qemu }}
          secrets: ${{ inputs.docker_secrets }}
          secret-envs: ${{ inputs.docker_secret_envs }}
          secret-files: ${{ inputs.docker_secret_files }}
          ulimit: ${{ inputs.docker_ulimit }}
          build-args: ${{ inputs.docker_build_args }}
          ignore_trivy: ${{ inputs.ignore_trivy }}
          run_trivy: ${{ inputs.run_trivy }}

      - name: Resolve image digest
        id: digest
        if: ${{ inputs.push && inputs.sign_image }}
        env:
          IMAGE_REF: "${{ inputs.jfrog_url }}/${{ steps.env-vars.outputs.IMAGE_NAME }}:${{ github.sha }}"
        run: |
          set -euo pipefail
          DIGEST="$(docker buildx imagetools inspect "$IMAGE_REF" --format '{{json .Manifest.Digest}}' | jq -r .)"
          if [[ -z "$DIGEST" || "$DIGEST" != sha256:* ]]; then
            echo "Failed to resolve a sha256 digest for $IMAGE_REF (got: '$DIGEST')." >&2
            exit 1
          fi
          echo "IMAGE_DIGEST=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Resolved $IMAGE_REF -> $DIGEST"

      - name: Fetch signing key from Infisical
        if: ${{ inputs.push && inputs.sign_image }}
        uses: NethermindEth/github-workflows/get_infisical_secrets@main
        with:
          identity-id: ${{ secrets.infisical_identity_id }}
          project-id: ${{ secrets.infisical_project_id }}
          env-slug: prod
          secret-path: "/github/workflows_critical/jfrog-evidence"

      - name: Generate signature predicate
        if: ${{ inputs.push && inputs.sign_image }}
        env:
          P_ACTOR: ${{ github.actor }}
          P_WORKFLOW: ${{ github.workflow }}
          P_RUN_ID: ${{ github.run_id }}
          P_COMMIT: ${{ github.sha }}
          P_REPOSITORY: ${{ github.repository }}
          P_REF: ${{ github.ref }}
          P_DIGEST: ${{ steps.digest.outputs.IMAGE_DIGEST }}
        run: |
          set -euo pipefail
          jq -n \
            --arg actor "$P_ACTOR" \
            --arg workflow "$P_WORKFLOW" \
            --arg run_id "$P_RUN_ID" \
            --arg commit "$P_COMMIT" \
            --arg repository "$P_REPOSITORY" \
            --arg ref "$P_REF" \
            --arg image_digest "$P_DIGEST" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{actor:$actor, workflow:$workflow, run_id:$run_id, commit:$commit, repository:$repository, ref:$ref, timestamp:$timestamp, image_digest:$image_digest}' \
            > predicate.json
          cat predicate.json

      - name: Sign image with JFrog Evidence
        if: ${{ inputs.push && inputs.sign_image }}
        env:
          IMAGE_NAME: ${{ steps.env-vars.outputs.IMAGE_NAME }}
          PACKAGE_VERSION: ${{ github.sha }}
          REPO_NAME_INPUT: ${{ inputs.repo_name }}
          GROUP_NAME_INPUT: ${{ inputs.group_name }}
          PREDICATE_TYPE: ${{ inputs.predicate_type }}
          KEY_ALIAS: ${{ inputs.signing_key_alias }}
          PRIVATE_KEY: ${{ env.IMAGE_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -n "$REPO_NAME_INPUT" ]]; then
            REPO_NAME="$REPO_NAME_INPUT"
          else
            REPO_NAME="${GROUP_NAME_INPUT}-oci-local-dev"
          fi
          # IMAGE_NAME is "<repo>/<image>"; package-name is just "<image>"
          PACKAGE_NAME="${IMAGE_NAME#*/}"
          jf evd create \
            --package-name "$PACKAGE_NAME" \
            --package-version "$PACKAGE_VERSION" \
            --package-repo-name "$REPO_NAME" \
            --predicate ./predicate.json \
            --predicate-type "$PREDICATE_TYPE" \
            --key "$PRIVATE_KEY" \
            --key-alias "$KEY_ALIAS"

      - name: Evidence summary
        if: ${{ inputs.push && inputs.sign_image }}
        env:
          IMAGE_NAME: ${{ steps.env-vars.outputs.IMAGE_NAME }}
          PACKAGE_VERSION: ${{ github.sha }}
          IMAGE_DIGEST: ${{ steps.digest.outputs.IMAGE_DIGEST }}
          PREDICATE_TYPE: ${{ inputs.predicate_type }}
          KEY_ALIAS: ${{ inputs.signing_key_alias }}
        run: |
          {
            echo "### JFrog Evidence signed"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Image | \`${IMAGE_NAME}\` |"
            echo "| Package version (tag) | \`${PACKAGE_VERSION}\` |"
            echo "| Manifest digest | \`${IMAGE_DIGEST}\` |"
            echo "| Predicate type | \`${PREDICATE_TYPE}\` |"
            echo "| Key alias | \`${KEY_ALIAS}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
