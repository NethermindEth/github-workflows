# DEPRECATED: Use docker-build-push-jfrog.yaml or docker-build-push-dockerhub.yaml instead

on:
  workflow_call:
    inputs:
      artifactory_url:
        description: "URL of Artifactory server"
        type: string
        default: "nethermind.jfrog.io"
        required: false
      artifactory_repo:
        description: "Artifactory repository, e.g. 'angkor-oci-local'"
        type: string
        required: true
      image_name:
        description: "Name of the image to publish.  Defaults to the repository name."
        type: string
        required: false
        default: "${{ github.event.repository.name }}"
      context:
        description: "Build's context is the set of files located in the specified PATH or URL"
        type: string
        default: "."
        required: false
      platforms:
        description: >
          Platforms to build for (comma-separated, example: linux/amd64,linux/arm64). Currently only one platform at a time is supported.
          Trivy expects a single image in the manifest list.
          Running this action more than once with multiple platform won't push the manifest list correctly.
        type: string
        default: "linux/amd64"
        required: false
      setup-qemu:
        description: "Set up QEMU"
        type: boolean
        default: false
        required: false
      dockerfile_path:
        description: "Path to Dockerfile"
        type: string
        default: "Dockerfile"
        required: false
      additional_tags:
        description: "Additional tags to apply (comma-separated)"
        type: string
        default: ""
        required: false
      use_cache:
        description: "Use cache for build"
        type: boolean
        default: true
        required: false
      skip_attest:
        description: "Skip docker image attestation"
        type: boolean
        default: false
        required: false
      repository:
        description: "Repository to checkout"
        type: string
        default: ${{ github.repository }}
        required: false
      ref:
        description: "Reference - branch, tag or SHA to checkout"
        type: string
        default: ${{ github.ref }}
        required: false

    secrets:
      artifactory_access_token:
        description: "A token used to communicate with Artifactory"
        required: true
      artifactory_username:
        description: "Username for Artifactory authentication"
        required: true
      checkout_token:
        description: "token used for checkout"
        required: false

permissions:
  id-token: write
  attestations: write
  contents: read

jobs:
  docker-build:
    name: Docker Build, Scan, Attest and Push
    runs-on: ubuntu-latest
    steps:
      - name: Validate checkout token
        if: ${{ inputs.repository != github.repository }}
        env:
          CHECKOUT_TOKEN: ${{ secrets.checkout_token }}
        run: |
          if [ -z "$CHECKOUT_TOKEN" ]; then
            echo "Error: checkout_token secret is required when checking out a different repository"
            echo "Repository requested: ${{ inputs.repository }}"
            echo "Current repository: ${{ github.repository }}"
            exit 1
          fi

      - name: Checkout code
        id: checkout
        uses: actions/checkout@ff7abcd0c3c05ccf6adc123a8cd1fd4fb30fb493 # v4.1.1
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ inputs.repository != github.repository && secrets.checkout_token || secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        if: ${{ inputs.setup-qemu }}
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Login to Registry
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: https://${{ inputs.artifactory_url }}
          username: ${{ secrets.artifactory_username }}
          password: ${{ secrets.artifactory_access_token }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: ${{ inputs.artifactory_url }}/${{ inputs.artifactory_repo }}/${{ inputs.image_name }}
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=raw,value=${{ github.ref_type == 'tag' && github.ref_name || '' }},enable=${{ github.ref_type == 'tag' }}
            type=sha
            ${{ inputs.additional_tags != '' && format('type=raw,value={0}', inputs.additional_tags) || '' }}

      - name: Generate version string
        id: version
        run: |
          TAG_NAME=$(git describe --exact-match --tags HEAD 2>/dev/null) && VERSION="${TAG_NAME}-$(git rev-parse --short HEAD)" || VERSION="$(git rev-parse --abbrev-ref HEAD)-$(git rev-parse --short HEAD)"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Docker Build
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          cache-from: ${{ inputs.use_cache && 'type=gha' || '' }}
          cache-to: ${{ inputs.use_cache && 'type=gha,mode=max' || '' }}
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile_path }}
          platforms: ${{ inputs.platforms }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          outputs: |
            type=image,push=false
            type=docker
          tags: latest

      - name: Docker Push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        id: push
        with:
          tags: ${{ steps.meta.outputs.tags }}
          push: true

      - name: Attest
        if: ${{ success() && !inputs.skip_attest }}
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        id: attest
        with:
          subject-name: ${{ steps.meta.outputs.tags }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Summary
        if: always()
        run: |
          echo "### Build status" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Build and push successful" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Build failed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "### Image Tags" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" | while IFS= read -r TAG; do
            echo "- $TAG" >> $GITHUB_STEP_SUMMARY
          done
          echo '```' >> $GITHUB_STEP_SUMMARY
