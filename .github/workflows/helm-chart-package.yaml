name: Package Helm Chart

on:
  workflow_call:
    inputs:
      jfrog_url:
        description: "URL of Artifactory server"
        type: string
        default: "https://nethermind.jfrog.io"
      CHART_PATH:
        description: "Chart path"
        type: string
        required: true
      CHART_FILENAME:
        description: "Name of chart.yaml file"
        type: string
        default: "Chart.yaml"
    secrets:
      ARTIFACTORY_API_TOKEN:
        description: "A token used to communicate with Artifactory"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Update Helm Dependencies
        env:
          INPUT_CHART_PATH: ${{ inputs.CHART_PATH }}
        run: |
          cd "${INPUT_CHART_PATH}"
          helm dependency update

      - name: Lint Helm Chart
        env:
          INPUT_CHART_PATH: ${{ inputs.CHART_PATH }}
        run: |
          cd "${INPUT_CHART_PATH}"
          helm lint .

      - name: Run Helm Tests if present
        env:
          INPUT_CHART_PATH: ${{ inputs.CHART_PATH }}
        run: |
          cd "${INPUT_CHART_PATH}"
          if [ -d "tests" ] && [ "$(ls -A tests)" ]; then
            echo "Tests found. Running Helm tests..."
            helm test .
          else
            echo "No tests found. Skipping Helm tests."
          fi

      - name: Set Environment Variables from Chart file
        # CHART_NAME and CHART_VERSION are derived from the Chart.yaml file in the
        # checked-out repository, which is a trusted source controlled by the repo owners.
        env:
          INPUT_CHART_PATH: ${{ inputs.CHART_PATH }}
          INPUT_CHART_FILENAME: ${{ inputs.CHART_FILENAME }}
        run: |
          cd "${INPUT_CHART_PATH}"
          CHART_NAME_VAL=$(grep '^name:' "${INPUT_CHART_FILENAME}" | awk '{print $2}')
          # Remove any embedded newlines to prevent environment variable injection
          CHART_NAME_VAL=$(printf '%s' "${CHART_NAME_VAL}" | tr -d '\\n')
          CHART_VERSION_VAL=$(grep '^version:' "${INPUT_CHART_FILENAME}" | awk '{print $2}')
          CHART_VERSION_VAL=$(printf '%s' "${CHART_VERSION_VAL}" | tr -d '\\n')

          DELIM="GHEOF_$(openssl rand -hex 8)"
          {
            echo "CHART_NAME<<${DELIM}"
            echo "${CHART_NAME_VAL}"
            echo "${DELIM}"
            echo "CHART_VERSION<<${DELIM}"
            echo "${CHART_VERSION_VAL}"
            echo "${DELIM}"
          } >> "$GITHUB_ENV"

      - name: Set up JFrog CLI
        uses: jfrog/setup-jfrog-cli@deda456d982fc5e9a7a020b63eb0d2968aedd33e # v5.1.0

      - name: Configure JFrog CLI
        env:
          ARTIFACTORY_API_TOKEN: ${{ secrets.ARTIFACTORY_API_TOKEN }}
          JFROG_URL: ${{ inputs.jfrog_url }}
        run: |

          echo "${ARTIFACTORY_API_TOKEN}" | jf config add test \
            --url="${JFROG_URL}" \
            --interactive=false \
            --access-token-stdin

      - name: Check Backward Compatibility
        id: backward-compatibility
        env:
          INPUT_CHART_PATH: ${{ inputs.CHART_PATH }}
          INPUT_CHART_FILENAME: ${{ inputs.CHART_FILENAME }}
          CHART_NAME: ${{ env.CHART_NAME }}
        run: |
          cd "${INPUT_CHART_PATH}"

          # Fetch the previous version of the chart from JFrog Artifactory
          git fetch origin main --depth=1
          PREVIOUS_VERSION=$(git show "origin/main:./${INPUT_CHART_FILENAME}" | grep '^version:' | awk '{print $2}')
          {
            echo "PREVIOUS_VERSION<<GHEOF"
            echo "${PREVIOUS_VERSION}"
            echo "GHEOF"
          } >> "$GITHUB_ENV"
          jf rt dl "helm-local/${CHART_NAME}-${PREVIOUS_VERSION}.tgz" --flat

          if [[ -f "${CHART_NAME}-${PREVIOUS_VERSION}.tgz" ]]; then
            echo "Previous version (${PREVIOUS_VERSION}) found. Checking for backward compatibility..."

            # Render templates for the new and previous versions
            helm template . > new-version.yaml
            helm template "${CHART_NAME}-${PREVIOUS_VERSION}.tgz" > previous-version.yaml

            echo "Differences in the both charts template "
            diff -u previous-version.yaml new-version.yaml | awk '
            /^-/ { last_removed=$0; print last_removed; next }
            /^\+/ { if (last_removed != "") { print $0; last_removed="" } next }
            '| tee diff.txt

          else
            echo "No previous version found. Skipping backward compatibility check."
          fi

      - name: Install Helm-docs and create README file for Helm chart
        env:
          INPUT_CHART_PATH: ${{ inputs.CHART_PATH }}
        run: |
          curl -sSLo helm-docs.tar.gz https://github.com/norwoodj/helm-docs/releases/download/v1.14.2/helm-docs_1.14.2_Linux_x86_64.tar.gz
          tar -xzf helm-docs.tar.gz
          chmod +x helm-docs
          mv helm-docs /usr/local/bin/
          cd "${INPUT_CHART_PATH}"
          helm-docs "${INPUT_CHART_PATH}"

      - name: Check if the chart version already exist
        env:
          PREVIOUS_VERSION: ${{ env.PREVIOUS_VERSION }}
          CHART_VERSION: ${{ env.CHART_VERSION }}
        run: |
          echo "Previous Chart Version: ${PREVIOUS_VERSION}"
          echo "Current Chart Version: ${CHART_VERSION}"
          if [[ "${PREVIOUS_VERSION}" != "${CHART_VERSION}" ]]; then
            echo "Chart version has changed!"
          else
            echo "Chart version already exist please update the chart version"
            exit 1
          fi

      - name: Package Helm Chart
        env:
          INPUT_CHART_PATH: ${{ inputs.CHART_PATH }}
          CHART_VERSION: ${{ env.CHART_VERSION }}
        run: |
          cd "${INPUT_CHART_PATH}"
          helm package . --app-version "${CHART_VERSION}"
          ls -la

      - name: Run Trivy vulnerability scanner in IaC mode
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "config"
          scan-ref: "${{ inputs.CHART_PATH }}/${{ env.CHART_NAME }}-${{ env.CHART_VERSION }}.tgz"
          format: "sarif"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"
          output: "trivy-results.sarif"
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db
          TRIVY_DISABLE_VEX_NOTICE: true

      - name: merge trivy scan and diff result in single file to show it on PR marocchino/sticky-pull-request-comment
        id: merge_trivy_and_diff_output
        env:
          INPUT_CHART_PATH: ${{ inputs.CHART_PATH }}
        run: |
          # Write Trivy result and diff into the output file in one go
          {
            echo "### Trivy Scan Result"
            echo "Trivy Scan Result for Security Vulnerabilities:"
            echo ""
            cat trivy-results.sarif
            echo ""
            echo "----------------------------------------"
            echo ""
            echo "### Diff on Comparing Chart with Previous Version"
            echo "Diff between the new and old chart versions:"
            echo ""
            if [ -f "${INPUT_CHART_PATH%/}/diff.txt" ]; then
              cat "${INPUT_CHART_PATH%/}/diff.txt"
            else
              echo "No diff file found."
            fi
          } > pr_comment.txt

      - name: Send notification on PR
        if: github.event.pull_request != null
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3
        with:
          header: "Chart Compatibility Check"
          recreate: true
          hide_classify: "OUTDATED"
          path: pr_comment.txt

      - name: Publish Helm Chart to JFrog if not Already Exists in JFrog
        env:
          INPUT_CHART_PATH: ${{ inputs.CHART_PATH }}
          CHART_NAME: ${{ env.CHART_NAME }}
          CHART_VERSION: ${{ env.CHART_VERSION }}
        run: |
          cd "${INPUT_CHART_PATH}"
          if jf rt s "helm-local/${CHART_NAME}-${CHART_VERSION}.tgz" | grep -q "${CHART_NAME}-${CHART_VERSION}.tgz"; then
            echo "Helm chart ${CHART_NAME} version ${CHART_VERSION} already exists in JFrog. Please update the version before pushing."
            exit 1
          else
            echo "Helm chart version ${CHART_VERSION} is not found in JFrog. Proceeding with upload..."
            jf rt u "*.tgz" "helm-local/"
          fi

      - name: Summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [[ "${JOB_STATUS}" == "success" ]]; then
            echo "✅ Helm chart published successfully"
          else
            echo "❌ Helm chart publishing failed"
          fi

          echo "### Trivy Scan Output"
          if [[ -s 'trivy-results.sarif' ]]; then
            cat trivy-results.sarif
          else
            echo "trivy-results.sarif file not found"
          fi
