version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "fix"
      include: "scope"
    groups:
      all-github-actions:
        patterns:
          - "*"
  - package-ecosystem: pip
    directory: /.github/requirements
    schedule:
      interval: weekly
    commit-message:
      prefix: "fix"
      include: "scope"
    groups:
      all-pip:
        patterns:
          - "*"
