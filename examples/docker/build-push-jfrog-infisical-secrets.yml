name: publish image

on:
  push:
    branches: [main]

permissions:
  id-token: write
  attestations: write
  artifact-metadata: write
  contents: read

jobs:
  publish:
    uses: NethermindEth/github-workflows/.github/workflows/docker-build-push-jfrog.yaml@stable
    with:
      group_name: angkor
      image_name: my-signed-artifact
      # Secrets at this Infisical path are exported into the job environment (masked) before
      # the build; docker_secret_envs maps them onto BuildKit secret ids. In the Dockerfile:
      #   RUN --mount=type=secret,id=signing_key,required=true sign -key /run/secrets/signing_key ...
      infisical_env_slug: prod
      infisical_secret_path: /apps/my-signed-artifact
      docker_secret_envs: |
        signing_key=SIGNING_KEY
        public_key=PUBLIC_KEY
      # No shared layer cache: the stages pull private images and consume a secret.
      cache_from: ""
      cache_to: ""
    secrets:
      infisical_identity_id: ${{ secrets.INFISICAL_IDENTITY_ID }}
      infisical_project_id: ${{ secrets.INFISICAL_PROJECT_ID }}
