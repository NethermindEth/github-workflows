name: Load secrets from Infisical (env vars)

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Load secrets from Infisical
        uses: NethermindEth/github-workflows/get_infisical_secrets@stable
        with:
          identity-id: ${{ secrets.INFISICAL_IDENTITY_ID }}
          project-id: ${{ secrets.INFISICAL_PROJECT_ID }}
          env-slug: prod

      # Secrets are now available as environment variables.
      # The secret path defaults to /github/workflows/<repo-name>.
      - name: Use secrets
        run: |
          echo "DB_HOST is set: ${DB_HOST:+yes}"
          echo "API_KEY is set: ${API_KEY:+yes}"
