name: Load secrets from Infisical (.env file)

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Write secrets to a .env file instead of environment variables.
      # Useful for applications that read from .env files.
      - name: Load secrets to .env file
        uses: NethermindEth/github-workflows/get_infisical_secrets@stable
        with:
          identity-id: ${{ secrets.INFISICAL_IDENTITY_ID }}
          project-id: ${{ secrets.INFISICAL_PROJECT_ID }}
          env-slug: dev
          export-type: file
          file-path: .env

      - name: Run application
        run: |
          # Your app reads from .env
          docker compose up -d
