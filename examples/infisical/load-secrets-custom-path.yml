name: Load secrets from a custom Infisical path

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Use secret-path to override the default path (/github/workflows/<repo-name>).
      # Useful for shared secrets or CI/CD infrastructure secrets.
      - name: Load shared CI secrets
        uses: NethermindEth/github-workflows/get_infisical_secrets@stable
        with:
          identity-id: ${{ secrets.INFISICAL_IDENTITY_ID }}
          project-id: ${{ secrets.INFISICAL_PROJECT_ID }}
          env-slug: prod
          secret-path: "/github/workflows/terragrunt"

      - name: Use secrets
        run: |
          echo "GH_APP_ID is set: ${GH_APP_ID:+yes}"
