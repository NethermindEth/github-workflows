name: Load secrets from multiple Infisical environments

on:
  push:
    branches: [main, staging]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Determine environment based on branch
      - name: Set environment
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "slug=prod" >> "$GITHUB_OUTPUT"
          else
            echo "slug=staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Load secrets from Infisical
        uses: NethermindEth/github-workflows/get_infisical_secrets@stable
        with:
          identity-id: ${{ secrets.INFISICAL_IDENTITY_ID }}
          project-id: ${{ secrets.INFISICAL_PROJECT_ID }}
          env-slug: ${{ steps.env.outputs.slug }}

      - name: Deploy
        run: |
          echo "Deploying to ${{ steps.env.outputs.slug }}"
